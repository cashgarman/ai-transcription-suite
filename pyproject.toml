[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-transcriber"
version = "1.0.0"
description = "Private local transcription with word timestamps and speaker diarization"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1",
    "whisperx>=3.3",
    "pyannote.audio>=3.1,<4",
    "PySide6>=6.8",
    "python-dotenv>=1.0",
    "keyring>=25",
    "torch>=2.5",
    "torchaudio>=2.5",
    "nvidia-cudnn-cu12==8.9.7.29",
    "ollama>=0.4",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "pyinstaller>=6.11",
]
pdf-html = [
    "weasyprint>=62",
]

[project.scripts]
speaker-transcriber = "speaker_transcriber.__main__:main"
speaker-transcriber-gui = "speaker_transcriber.app:main"

[tool.setuptools.packages.find]
include = ["speaker_transcriber*"]

[tool.setuptools.package-data]
speaker_transcriber = ["prompts/*.txt", "assets/*.ico", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
